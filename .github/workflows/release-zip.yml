name: Build HACS Release ZIP

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build integration ZIP
        run: |
          mkdir -p dist/airos_xs2
          cp -r custom_components/airos_xs2/. dist/airos_xs2/
          cd dist
          zip -r ../airos-http.zip airos_xs2
          cd ..
          sha256sum airos-http.zip > airos-http.zip.sha256
      - name: Upload ZIP and checksum to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            airos-http.zip airos-http.zip.sha256 --clobber
